version: 1
reviewed: 2026-10-17
public_safe: true

virtualization:
  platform: proxmox
  nodes:
    - name: proxmox1
      role: small-node-general-capacity
    - name: proxmox2
      role: 3u-core-i5-primary-app-control-and-storage-hosting
    - name: proxmox3
      role: retained-sff-gaming-app-automation-and-workstation-hosting
      allocation_note: fixed-ram-is-intentional-for-gaming-workstation-use

control_plane:
  mcp:
    host: admin-vm01
    transport: outbound-secure-tunnel
    integrations:
      proxmox: read-only
      semaphore: controlled-write
      portainer: guarded-write
      unifi: read-and-telemetry
  preferred_write_layer: semaphore

important_guests:
  - name: admin-vm01
    platform: qemu
    node: proxmox2
    purpose: administrative-docker-host
  - name: docker-vm01
    platform: qemu
    node: proxmox2
    purpose: general-docker-host
  - name: NFS
    platform: lxc
    node: proxmox2
    purpose: authoritative-user-data-storage
  - name: Linux-Mint
    platform: qemu
    node: proxmox3
    purpose: workstation
  - name: Ansible
    platform: lxc
    node: proxmox3
    purpose: automation
  - name: MinIO
    platform: lxc
    node: proxmox3
    purpose: object-storage
  - name: Home-Assistant
    platform: qemu
    node: proxmox2
    purpose: home-automation
    lifecycle: intentionally-stopped-pending-later-rebuild
  - name: ha-vm01
    platform: qemu
    node: proxmox2
    purpose: home-automation
    lifecycle: intentionally-stopped-pending-later-rebuild

portainer:
  git_backed_stacks:
    - authentik
    - romm-server
    - family-archive
  self_managed_exception:
    - homelab-mcp
  notes:
    - homelab-mcp must not redeploy itself through MCP
    - environment variable values must never be emitted into documentation

future_capabilities:
  codex:
    available: true
    intended_pattern: semaphore-launches-isolated-codex-job
    preferred_output: git-branch-or-pull-request


storage_policy:
  infrastructure_backup_cadence: weekly
  authoritative_data_tier: NFS
  authoritative_data_independent_backup: false
  storage_space_redundant: true
  notes:
    - NFS real data currently lacks independent backup due to capacity limits
    - redundancy is not considered a substitute for backup

transition:
  goal: git-and-iac-source-of-truth
  docker_target:
    - compose-and-deployment-definitions-in-github
    - reproducible-non-secret-configuration-in-github
  mutable_data_target: persistent-storage-not-git
  pbs:
    intended_future_state: retired
    prerequisite:
      - reproducible-infrastructure
      - independent-backup-for-authoritative-data
  chatgpt_role: assist-and-accelerate-transition
  consolidation_plan:
    status: provisional-not-approved
    direction: move-proxmox1-and-proxmox2-storage-and-services-to-bare-metal-truenas
    container_target: native-docker-and-custom-compose-where-appropriate
    retained_system: proxmox3-gaming-and-selected-workloads
    prerequisites:
      - measure-current-data-growth-and-snapshot-requirements
      - validate-independent-backup-and-restore-plan
      - validate-workload-placement-and-rollback
      - validate-memory-ecc-mode-end-to-end
