services:
  db:
    build:
      context: ./db
    image: humboldt-postgres:17
    container_name: humboldt-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - humboldt_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - humboldt_internal

  api:
    build:
      context: ./etl
    image: humboldt-etl:latest
    container_name: humboldt-query-api
    restart: unless-stopped
    entrypoint:
      - python
      - -m
      - uvicorn
      - humboldt_etl.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8780"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "192.168.86.173:8780:8780"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - humboldt_internal

  etl:
    build:
      context: ./etl
    image: humboldt-etl:latest
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-humboldt-public-records}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-104857600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - humboldt_internal

networks:
  humboldt_internal:
    name: humboldt_internal

volumes:
  humboldt_pgdata:
    name: humboldt_pgdata
