name: family-archive

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    container_name: immich-server
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      DB_HOSTNAME: immich-database
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
    volumes:
      - type: volume
        source: immich_library
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: family_archive
        target: /external/archive
        read_only: true
        volume:
          nocopy: true
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${IMMICH_HTTP_PORT:-2283}:2283"
    depends_on:
      immich-database:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - immich_model_cache:/cache
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: ${IMMICH_DB_STORAGE_TYPE:-SSD}
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname='${IMMICH_DB_NAME:-immich}' --username='${IMMICH_DB_USERNAME:-postgres}' || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  grampsweb:
    image: ghcr.io/gramps-project/grampsweb:${GRAMPSWEB_VERSION:-latest}
    container_name: grampsweb
    restart: unless-stopped
    environment:
      GRAMPSWEB_TREE: ${GRAMPSWEB_TREE:-Family Tree}
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb-redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb-redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb-redis:6379/1
    volumes:
      - grampsweb_users:/app/users
      - grampsweb_index:/app/indexdir
      - grampsweb_thumbnails:/app/thumbnail_cache
      - grampsweb_cache:/app/cache
      - grampsweb_secret:/app/secret
      - grampsweb_database:/root/.gramps/grampsdb
      - type: volume
        source: grampsweb_media
        target: /app/media
        volume:
          nocopy: true
      - grampsweb_tmp:/tmp
    ports:
      - "${GRAMPSWEB_HTTP_PORT:-5000}:5000"
    depends_on:
      grampsweb-redis:
        condition: service_healthy

  grampsweb-celery:
    image: ghcr.io/gramps-project/grampsweb:${GRAMPSWEB_VERSION:-latest}
    container_name: grampsweb-celery
    restart: unless-stopped
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=${GRAMPSWEB_CELERY_CONCURRENCY:-2}
    environment:
      GRAMPSWEB_TREE: ${GRAMPSWEB_TREE:-Family Tree}
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb-redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb-redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb-redis:6379/1
    volumes:
      - grampsweb_users:/app/users
      - grampsweb_index:/app/indexdir
      - grampsweb_thumbnails:/app/thumbnail_cache
      - grampsweb_cache:/app/cache
      - grampsweb_secret:/app/secret
      - grampsweb_database:/root/.gramps/grampsdb
      - type: volume
        source: grampsweb_media
        target: /app/media
        volume:
          nocopy: true
      - grampsweb_tmp:/tmp
    depends_on:
      grampsweb:
        condition: service_started
      grampsweb-redis:
        condition: service_healthy

  grampsweb-redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: grampsweb-redis
    restart: unless-stopped
    volumes:
      - grampsweb_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  immich_library:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.86.82},rw,nfsvers=4,hard,timeo=600,retrans=2"
      device: ":${NFS_EXPORT_ROOT:-/data/apps/family-archive}/immich/library"

  family_archive:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.86.82},ro,nfsvers=4,hard,timeo=600,retrans=2"
      device: ":${NFS_EXPORT_ROOT:-/data/apps/family-archive}/archive"

  grampsweb_media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.86.82},rw,nfsvers=4,hard,timeo=600,retrans=2"
      device: ":${NFS_EXPORT_ROOT:-/data/apps/family-archive}/gramps/media"

  immich_postgres:
  immich_model_cache:
  grampsweb_users:
  grampsweb_index:
  grampsweb_thumbnails:
  grampsweb_cache:
  grampsweb_secret:
  grampsweb_database:
  grampsweb_tmp:
  grampsweb_redis_data:
