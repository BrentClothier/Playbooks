services:
  homelab-mcp:
    image: ghcr.io/brentclothier/homelab-mcp:latest
    pull_policy: always
    container_name: homelab-mcp
    restart: unless-stopped

    environment:
      - PVE_URL=${PVE_URL}
      - PVE_TOKEN_ID=${PVE_TOKEN_ID}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-true}

      - SEMAPHORE_URL=${SEMAPHORE_URL:-}
      - SEMAPHORE_API_TOKEN=${SEMAPHORE_API_TOKEN:-}
      - SEMAPHORE_ALLOWED_TEMPLATES=${SEMAPHORE_ALLOWED_TEMPLATES:-}
      - SEMAPHORE_VERIFY_SSL=${SEMAPHORE_VERIFY_SSL:-true}
      - SEMAPHORE_BOOTSTRAP_ENABLED=${SEMAPHORE_BOOTSTRAP_ENABLED:-false}

      - PORTAINER_URL=${PORTAINER_URL:-}
      - PORTAINER_API_TOKEN=${PORTAINER_API_TOKEN:-}
      - PORTAINER_VERIFY_SSL=${PORTAINER_VERIFY_SSL:-true}

      - UNIFI_URL=${UNIFI_URL:-}
      - UNIFI_API_KEY=${UNIFI_API_KEY:-}
      - UNIFI_VERIFY_SSL=${UNIFI_VERIFY_SSL:-true}
      - UNIFI_PROTECT_URL=${UNIFI_PROTECT_URL:-${UNIFI_URL:-}}
      - UNIFI_PROTECT_API_KEY=${UNIFI_PROTECT_API_KEY:-${UNIFI_API_KEY:-}}
      - UNIFI_PROTECT_VERIFY_SSL=${UNIFI_PROTECT_VERIFY_SSL:-${UNIFI_VERIFY_SSL:-true}}
      - UNIFI_SYSLOG_ENABLED=${UNIFI_SYSLOG_ENABLED:-true}
      - UNIFI_EVENT_DB=/data/unifi_events.db
      - UNIFI_EVENT_RETENTION_DAYS=${UNIFI_EVENT_RETENTION_DAYS:-30}

      - TRUENAS_URL=${TRUENAS_URL:-}
      - TRUENAS_API_KEY=${TRUENAS_API_KEY:-}
      - TRUENAS_VERIFY_SSL=${TRUENAS_VERIFY_SSL:-true}
      - TRUENAS_USERNAME=${TRUENAS_USERNAME:-homelab-mcp}
      - TRUENAS_ADMIN_ENABLED=${TRUENAS_ADMIN_ENABLED:-false}
      - TRUENAS_ADMIN_USERNAME=${TRUENAS_ADMIN_USERNAME:-}
      - TRUENAS_ADMIN_API_KEY=${TRUENAS_ADMIN_API_KEY:-}
      - TRUENAS_ADMIN_DATASETS=${TRUENAS_ADMIN_DATASETS:-}
      - TRUENAS_ADMIN_SNAPSHOT_DATASETS=${TRUENAS_ADMIN_SNAPSHOT_DATASETS:-}
      - TRUENAS_ADMIN_APPS=${TRUENAS_ADMIN_APPS:-}
      - TRUENAS_DIAGNOSTIC_DATASETS=${TRUENAS_DIAGNOSTIC_DATASETS:-}
      - TRUENAS_SEMAPHORE_DEPLOY_ENABLED=${TRUENAS_SEMAPHORE_DEPLOY_ENABLED:-false}
      - TRUENAS_SEMAPHORE_DB_SECRET=${TRUENAS_SEMAPHORE_DB_SECRET:-}
      - TRUENAS_SEMAPHORE_ADMIN_SECRET=${TRUENAS_SEMAPHORE_ADMIN_SECRET:-}
      - TRUENAS_SEMAPHORE_ENCRYPTION_SECRET=${TRUENAS_SEMAPHORE_ENCRYPTION_SECRET:-}
      - TRUENAS_SEMAPHORE_BIND_ADDRESS=${TRUENAS_SEMAPHORE_BIND_ADDRESS:-}

    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8765}:8000"
      - "${UNIFI_SYSLOG_BIND_IP:-0.0.0.0}:${UNIFI_SYSLOG_HOST_PORT:-5514}:5514/udp"

    networks:
      - homelab-mcp-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    volumes:
      - homelab-mcp-data:/data

    tmpfs:
      - /tmp:size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  openai-tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.14
    pull_policy: always
    container_name: openai-tunnel-client
    restart: unless-stopped

    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-tunnel_6ab2fb10ce6c819184f15c9ea53a5827}
      MCP_SERVER_URL: http://homelab-mcp:8000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: :8080

    depends_on:
      homelab-mcp:
        condition: service_healthy

    ports:
      - "127.0.0.1:${TUNNEL_HTTP_PORT:-8766}:8080"

    networks:
      - homelab-mcp-net

networks:
  homelab-mcp-net:
    name: homelab-mcp-net

volumes:
  homelab-mcp-data:
    name: homelab-mcp-data
