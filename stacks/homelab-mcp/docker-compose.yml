services:
  homelab-mcp:
    image: ghcr.io/brentclothier/homelab-mcp:latest
    pull_policy: always
    container_name: homelab-mcp
    restart: unless-stopped

    environment:
      - PVE_URL=${PVE_URL}
      - PVE_TOKEN_ID=${PVE_TOKEN_ID}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-true}

      - SEMAPHORE_URL=${SEMAPHORE_URL:-}
      - SEMAPHORE_API_TOKEN=${SEMAPHORE_API_TOKEN:-}
      - SEMAPHORE_VERIFY_SSL=${SEMAPHORE_VERIFY_SSL:-true}

    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8765}:8000"

    networks:
      - homelab-mcp-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  openai-tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.14
    pull_policy: always
    container_name: openai-tunnel-client
    restart: unless-stopped

    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://homelab-mcp:8000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: :8080

    depends_on:
      homelab-mcp:
        condition: service_healthy

    ports:
      - "127.0.0.1:${TUNNEL_HTTP_PORT:-8766}:8080"

    networks:
      - homelab-mcp-net

networks:
  homelab-mcp-net:
    name: homelab-mcp-net
