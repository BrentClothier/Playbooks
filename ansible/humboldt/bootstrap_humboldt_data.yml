---
- name: Bootstrap Humboldt data VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    humboldt_vm_name: "humboldt-data01.home"
    humboldt_vm_host: "192.168.86.173"
    humboldt_vm_user: "root"

  tasks:
    - name: Wait for Humboldt data VM SSH
      ansible.builtin.wait_for:
        host: "{{ humboldt_vm_host }}"
        port: 22
        delay: 10
        timeout: 900

    - name: Add Humboldt data VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ humboldt_vm_name }}"
        ansible_host: "{{ humboldt_vm_host }}"
        ansible_user: "{{ humboldt_vm_user }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: humboldt_data

- name: Configure Humboldt data VM
  hosts: humboldt_data
  become: true
  gather_facts: true

  vars:
    humboldt_stack_dir: /opt/humboldt-data
    humboldt_stack_source: "{{ playbook_dir }}/../../stacks/humboldt-data"

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - qemu-guest-agent
          - python3
        state: present

    - name: Enable QEMU guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.asc
        mode: "0644"
        force: true

    - name: Install Docker signing key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Make Docker signing key readable
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker engine and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create Humboldt stack directory
      ansible.builtin.file:
        path: "{{ humboldt_stack_dir }}"
        state: directory
        mode: "0750"

    - name: Copy Humboldt stack
      ansible.builtin.copy:
        src: "{{ humboldt_stack_source }}/"
        dest: "{{ humboldt_stack_dir }}/"
        mode: preserve

    - name: Check whether database environment exists
      ansible.builtin.stat:
        path: "{{ humboldt_stack_dir }}/.env"
      register: humboldt_env

    - name: Generate persistent database credentials
      ansible.builtin.shell: |
        set -eu
        umask 077
        password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
        cat > "{{ humboldt_stack_dir }}/.env" <<EOF
        POSTGRES_DB=humboldt
        POSTGRES_USER=humboldt_admin
        POSTGRES_PASSWORD=$password
        EOF
      args:
        executable: /bin/bash
      when: not humboldt_env.stat.exists
      no_log: true

    - name: Secure database environment file
      ansible.builtin.file:
        path: "{{ humboldt_stack_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Build and start Humboldt data services
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ humboldt_stack_dir }}"
      register: humboldt_compose
      changed_when: >-
        'Started' in humboldt_compose.stdout
        or 'Created' in humboldt_compose.stdout
        or 'Built' in humboldt_compose.stdout

    - name: Wait for PostgreSQL health
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T db
          pg_isready -U humboldt_admin -d humboldt
        chdir: "{{ humboldt_stack_dir }}"
      register: humboldt_db_health
      retries: 30
      delay: 5
      until: humboldt_db_health.rc == 0
      changed_when: false

    - name: Apply idempotent database schema
      ansible.builtin.shell: |
        set -eu
        docker compose exec -T db sh -lc '
          set -eu
          for sql in /docker-entrypoint-initdb.d/*.sql; do
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$sql"
          done
        '
      args:
        executable: /bin/bash
        chdir: "{{ humboldt_stack_dir }}"
      changed_when: false

    - name: Verify PostGIS and pgvector
      ansible.builtin.command:
        cmd: docker compose --profile tools run --rm etl db-health
        chdir: "{{ humboldt_stack_dir }}"
      register: humboldt_extension_health
      changed_when: false

    - name: Verify read-only Humboldt query API
      block:
        - name: Wait for read-only Humboldt query API
          ansible.builtin.command:
            cmd: >-
              python3 -c
              "import urllib.request; urllib.request.urlopen('http://{{ ansible_host }}:8780/health', timeout=5).read()"
          register: humboldt_api_health
          retries: 20
          delay: 3
          until: humboldt_api_health.rc == 0
          changed_when: false

      rescue:
        - name: Inspect Humboldt query API container
          ansible.builtin.command:
            cmd: docker compose ps api
            chdir: "{{ humboldt_stack_dir }}"
          register: humboldt_api_ps
          changed_when: false
          failed_when: false

        - name: Read Humboldt query API logs
          ansible.builtin.command:
            cmd: docker compose logs --no-color --tail=120 api
            chdir: "{{ humboldt_stack_dir }}"
          register: humboldt_api_logs
          changed_when: false
          failed_when: false

        - name: Show Humboldt query API status
          ansible.builtin.debug:
            var: humboldt_api_ps.stdout_lines

        - name: Show Humboldt query API logs
          ansible.builtin.debug:
            var: humboldt_api_logs.stdout_lines

        - name: Fail after collecting Humboldt query API diagnostics
          ansible.builtin.fail:
            msg: "Humboldt query API did not become healthy; diagnostics are shown above."

    - name: Run initial public-records sync
      ansible.builtin.command:
        cmd: >-
          docker compose --profile tools run --rm etl
          sync-all --legistar-days-back 730
        chdir: "{{ humboldt_stack_dir }}"
      register: humboldt_initial_sync
      changed_when: false

    - name: Show initial public-records sync result
      ansible.builtin.debug:
        var: humboldt_initial_sync.stdout_lines
