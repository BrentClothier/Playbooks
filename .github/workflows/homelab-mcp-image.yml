name: Build HomeLab MCP image

on:
  push:
    branches:
      - main
    paths:
      - "stacks/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-image.yml"
  pull_request:
    paths:
      - "stacks/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install TrueNAS client test dependencies
        run: python -m pip install 'websockets>=15,<16' 'httpx>=0.28,<1'
      - name: Test TrueNAS read-only client
        working-directory: stacks/homelab-mcp
        run: |
          python -m py_compile server.py truenas_read.py semaphore_bootstrap.py semaphore_policy.py ../../scripts/truenas/semaphore_backup.py
          python -m unittest -v test_truenas_read test_semaphore_bootstrap test_semaphore_policy

  build-and-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile stacks/homelab-mcp/server.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish HomeLab MCP
        uses: docker/build-push-action@v6
        with:
          context: ./stacks/homelab-mcp
          push: true
          tags: |
            ghcr.io/brentclothier/homelab-mcp:latest
            ghcr.io/brentclothier/homelab-mcp:${{ github.sha }}
