name: Build HomeLab MCP image

on:
  push:
    branches:
      - main
    paths:
      - "stacks/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish HomeLab MCP
        uses: docker/build-push-action@v6
        with:
          context: ./stacks/homelab-mcp
          push: true
          tags: |
            ghcr.io/brentclothier/homelab-mcp:latest
            ghcr.io/brentclothier/homelab-mcp:${{ github.sha }}
