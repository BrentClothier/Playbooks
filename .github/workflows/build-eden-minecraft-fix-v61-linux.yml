name: Build Eden Minecraft Linux death respawn guard v61

# V61 preserves the complete v60 stack and guards the exact Minecraft Player 2 death/respawn null-callback crash signature.

on:
  push:
    branches:
      - eden-minecraft-socket-fix
    paths:
      - ".github/workflows/build-eden-minecraft-fix-v61-linux.yml"
      - "eden-fix/apply-v7.py"
      - "eden-fix/apply-v9.py"
      - "eden-fix/apply-v11.py"
      - "eden-fix/apply-v12.py"
      - "eden-fix/apply-v14b.py"
      - "eden-fix/apply-v15.py"
      - "eden-fix/apply-v16.py"
      - "eden-fix/apply-v17.py"
      - "eden-fix/apply-v18b.py"
      - "eden-fix/apply-v18c.py"
      - "eden-fix/apply-v19.py"
      - "eden-fix/apply-v20.py"
      - "eden-fix/apply-v21.py"
      - "eden-fix/apply-v22b.py"
      - "eden-fix/apply-v23b.py"
      - "eden-fix/apply-v24.py"
      - "eden-fix/apply-v25.py"
      - "eden-fix/apply-v26.py"
      - "eden-fix/apply-v27.py"
      - "eden-fix/apply-v29.py"
      - "eden-fix/apply-v30.py"
      - "eden-fix/apply-v31-linux-storage.py"
      - "eden-fix/apply-v32-linux-cache-size.py"
      - "eden-fix/apply-v33-linux-cache-reader.py"
      - "eden-fix/apply-v34-linux-save-space-diag.py"
      - "eden-fix/apply-v35-linux-save-data-uuid.py"
      - "eden-fix/v35-linux-save-data-uuid.patch"
      - "eden-fix/apply-v36-linux-filesystem-trace.py"
      - "eden-fix/v36-linux-filesystem-trace.patch"
      - "eden-fix/v36-overlay/**"
      - "eden-fix/apply-v37-linux-cache-program-id.py"
      - "eden-fix/v37-linux-cache-program-id.patch"
      - "eden-fix/apply-v38-linux-save-quota.py"
      - "eden-fix/v38-linux-save-quota.patch"
      - "eden-fix/apply-v39-linux-profile-controller.py"
      - "eden-fix/v39-linux-profile-controller.patch"
      - "eden-fix/apply-v40-linux-additional-user.py"
      - "eden-fix/v40-linux-additional-user.patch"
      - "eden-fix/apply-v41-linux-shared-profile-state.py"
      - "eden-fix/v41-linux-shared-profile-state.patch"
      - "eden-fix/v41-trigger/**"
      - "eden-fix/apply-v42-linux-shader-analysis-guard.py"
      - "eden-fix/v42-linux-shader-analysis-guard.patch"
      - "eden-fix/v42-trigger/**"
      - "eden-fix/apply-v43-linux-invalid-shader-guard.py"
      - "eden-fix/v43-linux-invalid-shader-guard.patch"
      - "eden-fix/apply-v44-linux-shader-boundary.py"
      - "eden-fix/v44-linux-shader-boundary.patch"
      - "eden-fix/apply-v45-linux-unconditional-shader-exit.py"
      - "eden-fix/v45-linux-unconditional-shader-exit.patch"
      - "eden-fix/apply-v46-linux-rotating-shader-boundary.py"
      - "eden-fix/v46-linux-rotating-shader-boundary.patch"
      - "eden-fix/apply-v47-linux-stage4-shader-boundary.py"
      - "eden-fix/v47-linux-stage4-shader-boundary.patch"
      - "eden-fix/apply-v48-linux-stage4-rotating-prefix.py"
      - "eden-fix/v48-linux-stage4-rotating-prefix.patch"
      - "eden-fix/apply-v49-linux-split-screen-render-diag.py"
      - "eden-fix/v49-linux-split-screen-render-diag.patch"
      - "eden-fix/apply-v50-linux-stage0-rotating-prefix.py"
      - "eden-fix/v50-linux-stage0-rotating-prefix.patch"
      - "eden-fix/apply-v51-linux-split-screen-trace-rearm.py"
      - "eden-fix/v51-linux-split-screen-trace-rearm.patch"
      - "eden-fix/apply-v52-linux-delete-cache-storage.py"
      - "eden-fix/v52-linux-delete-cache-storage.patch"
      - "eden-fix/apply-v53-linux-half-screen-clear-compat.py"
      - "eden-fix/v53-linux-half-screen-clear-compat.patch"
      - "eden-fix/apply-v54-linux-clean-logs.py"
      - "eden-fix/MINECRAFT-UPGRADE.md"
      - "eden-fix/apply-v55-linux-save-session-stability.py"
      - "eden-fix/v55-linux-save-session-stability.patch"
      - "eden-fix/apply-v56-linux-docked-clear-compat.py"
      - "eden-fix/v56-linux-docked-clear-compat.patch"
      - "eden-fix/apply-v57-linux-docked-clear-rect.py"
      - "eden-fix/v57-linux-docked-clear-rect.patch"
      - "eden-fix/apply-v58-linux-docked-msaa-alias-diag.py"
      - "eden-fix/v58-linux-docked-msaa-alias-diag.patch"
      - "eden-fix/apply-v59-linux-docked-accelerated-present.py"
      - "eden-fix/v59-linux-docked-accelerated-present.patch"
      - "eden-fix/apply-v60-linux-durable-save-commit.py"
      - "eden-fix/v60-linux-durable-save-commit.patch"
      - "eden-fix/apply-v61-linux-death-respawn-guard.py"
      - "eden-fix/v61-linux-death-respawn-guard.patch"
  workflow_dispatch:

permissions:
  contents: write

env:
  EDEN_COMMIT: 54046ac60ef5d8876b550be2546b89d48751de7e
  BUILD_ID: test
  DEVEL: "true"
  FORCE_PGO: "false"
  TARGET: amd64
  COMPILER: gcc
  PGO_TARGET: standard
  FULL_ARCH: amd64-gcc-standard
  BUILD_TYPE: Release
  LTO: "OFF"
  CCACHE: "OFF"
  ARTIFACT_REF: minecraft-linux-death-respawn-guard-v61
  GITHUB_TAG: minecraft-linux-death-respawn-guard-v61
  B2_PUBLIC_URL: example.invalid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Git
        run: pacman -Sy --noconfirm git ca-certificates python

      - name: Check out Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ env.EDEN_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: eden-src

      - name: Check out Eden CI scripts
        uses: actions/checkout@v4
        with:
          repository: Eden-CI/Workflow
          ref: master
          path: eden-ci

      - name: Apply v30-v60 stack plus v61 death respawn guard
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eden-src/.ci
          cp -a eden-ci/.ci eden-src/.ci
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            cp "eden-fix/apply-v${v}.py" "eden-src/apply-v${v}.py"
          done
          for script in apply-v31-linux-storage.py apply-v32-linux-cache-size.py \
                        apply-v33-linux-cache-reader.py apply-v34-linux-save-space-diag.py \
                        apply-v35-linux-save-data-uuid.py apply-v37-linux-cache-program-id.py \
                        apply-v38-linux-save-quota.py apply-v39-linux-profile-controller.py \
                        apply-v40-linux-additional-user.py \
                        apply-v41-linux-shared-profile-state.py \
                        apply-v42-linux-shader-analysis-guard.py \
                        apply-v43-linux-invalid-shader-guard.py \
                        apply-v44-linux-shader-boundary.py \
                        apply-v45-linux-unconditional-shader-exit.py \
                        apply-v46-linux-rotating-shader-boundary.py \
                        apply-v47-linux-stage4-shader-boundary.py \
                        apply-v48-linux-stage4-rotating-prefix.py \
                        apply-v49-linux-split-screen-render-diag.py \
                        apply-v50-linux-stage0-rotating-prefix.py \
                        apply-v51-linux-split-screen-trace-rearm.py \
                        apply-v52-linux-delete-cache-storage.py \
                        apply-v53-linux-half-screen-clear-compat.py \
                        apply-v54-linux-clean-logs.py \
                        apply-v55-linux-save-session-stability.py \
                        apply-v56-linux-docked-clear-compat.py \
                        apply-v57-linux-docked-clear-rect.py \
                        apply-v58-linux-docked-msaa-alias-diag.py \
                        apply-v59-linux-docked-accelerated-present.py \
                        apply-v60-linux-durable-save-commit.py \
                        apply-v61-linux-death-respawn-guard.py; do
            cp "eden-fix/${script}" "eden-src/${script}"
          done
          cp "eden-fix/v49-linux-split-screen-render-diag.patch" "eden-src/v49-linux-split-screen-render-diag.patch"
          cp "eden-fix/v50-linux-stage0-rotating-prefix.patch" "eden-src/v50-linux-stage0-rotating-prefix.patch"
          cp "eden-fix/v51-linux-split-screen-trace-rearm.patch" "eden-src/v51-linux-split-screen-trace-rearm.patch"
          cp "eden-fix/v52-linux-delete-cache-storage.patch" "eden-src/v52-linux-delete-cache-storage.patch"
          cp "eden-fix/v53-linux-half-screen-clear-compat.patch" "eden-src/v53-linux-half-screen-clear-compat.patch"
          cp "eden-fix/v55-linux-save-session-stability.patch" "eden-src/v55-linux-save-session-stability.patch"
          cp "eden-fix/v56-linux-docked-clear-compat.patch" "eden-src/v56-linux-docked-clear-compat.patch"
          cp "eden-fix/v57-linux-docked-clear-rect.patch" "eden-src/v57-linux-docked-clear-rect.patch"
          cp "eden-fix/v58-linux-docked-msaa-alias-diag.patch" "eden-src/v58-linux-docked-msaa-alias-diag.patch"
          cp "eden-fix/v59-linux-docked-accelerated-present.patch" "eden-src/v59-linux-docked-accelerated-present.patch"
          cp "eden-fix/v60-linux-durable-save-commit.patch" "eden-src/v60-linux-durable-save-commit.patch"
          cp "eden-fix/v61-linux-death-respawn-guard.patch" "eden-src/v61-linux-death-respawn-guard.patch"
          cd eden-src
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            python "apply-v${v}.py"
          done
          python apply-v31-linux-storage.py
          python apply-v32-linux-cache-size.py
          python apply-v33-linux-cache-reader.py
          python apply-v34-linux-save-space-diag.py
          python apply-v35-linux-save-data-uuid.py
          cd ..
          python eden-fix/apply-v36-linux-filesystem-trace.py eden-src
          cd eden-src
          python apply-v37-linux-cache-program-id.py
          python apply-v38-linux-save-quota.py
          python apply-v39-linux-profile-controller.py
          python apply-v40-linux-additional-user.py
          python apply-v41-linux-shared-profile-state.py
          python apply-v42-linux-shader-analysis-guard.py
          python apply-v43-linux-invalid-shader-guard.py
          python apply-v44-linux-shader-boundary.py
          python apply-v45-linux-unconditional-shader-exit.py
          python apply-v46-linux-rotating-shader-boundary.py
          python apply-v47-linux-stage4-shader-boundary.py
          python apply-v48-linux-stage4-rotating-prefix.py
          python apply-v49-linux-split-screen-render-diag.py
          python apply-v50-linux-stage0-rotating-prefix.py
          python apply-v51-linux-split-screen-trace-rearm.py
          python apply-v52-linux-delete-cache-storage.py
          python apply-v53-linux-half-screen-clear-compat.py
          python apply-v54-linux-clean-logs.py
          python apply-v55-linux-save-session-stability.py
          python apply-v56-linux-docked-clear-compat.py
          python apply-v57-linux-docked-clear-rect.py
          python apply-v58-linux-docked-msaa-alias-diag.py
          python apply-v59-linux-docked-accelerated-present.py
          python apply-v60-linux-durable-save-commit.py
          python apply-v61-linux-death-respawn-guard.py
          cd ..
          git -C eden-src diff --check
          git -C eden-src diff --stat

      - name: Archive source
        run: tar --exclude=.git -C eden-src -cJf Eden-minecraft-linux-death-respawn-guard-v61-source.tar.xz .

      - name: Install dependencies
        working-directory: eden-src
        shell: bash
        run: |
          ./.ci/deps/arch.sh
          pacman -S --noconfirm --overwrite "*" qt6-base
          test -f /usr/lib/cmake/Qt6OpenGL/Qt6OpenGLConfig.cmake

      - name: Configure
        working-directory: eden-src
        shell: bash
        run: |
          set -o pipefail
          if ./.ci/build/configure.sh 2>&1 | tee ../configure-v61.log; then
            exit 0
          fi
          diagnostic="$(grep -Ei -m 20 'CMake Error|Could NOT find|not found|fatal error|error:' \
            ../configure-v61.log | tail -n 20 || true)"
          if [ -z "$diagnostic" ]; then
            diagnostic="Configure exited nonzero without an allowlisted diagnostic line."
          fi
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Eden configure failed::${diagnostic}"
          exit 1

      - name: Build
        working-directory: eden-src
        shell: bash
        run: |
          set -o pipefail
          if cmake --build build --parallel "$(nproc)" 2>&1 | tee ../build-v61.log; then
            exit 0
          fi
          diagnostic="$(grep -Ei -m 40 'fatal error:|error:|undefined reference|collect2: error' ../build-v61.log | tail -n 40 | tr '\r\n' '  ' | sed 's/%/%25/g' || true)"
          if [ -z "$diagnostic" ]; then
            diagnostic="Build exited nonzero without an allowlisted compiler diagnostic line."
          fi
          echo "::error title=Eden v61 build failed::${diagnostic}"
          {
            echo "### Eden v61 compiler diagnostics"
            echo
            echo "<pre>"
            printf '%s\n' "$diagnostic"
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Package AppImage
        working-directory: eden-src
        run: ./.ci/package/linux.sh

      - name: Prepare release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp eden-src/artifacts/*.AppImage release/Eden-Linux-minecraft-death-respawn-guard-v61-amd64-gcc-standard.AppImage
          cp Eden-minecraft-linux-death-respawn-guard-v61-source.tar.xz release/
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            cp "eden-fix/apply-v${v}.py" release/
          done
          cp eden-fix/apply-v31-linux-storage.py eden-fix/apply-v32-linux-cache-size.py release/
          cp eden-fix/apply-v33-linux-cache-reader.py eden-fix/apply-v34-linux-save-space-diag.py release/
          cp eden-fix/apply-v35-linux-save-data-uuid.py release/
          cp eden-fix/apply-v36-linux-filesystem-trace.py eden-fix/v36-linux-filesystem-trace.patch release/
          tar -C eden-fix -cJf release/v36-filesystem-trace-overlay.tar.xz v36-overlay
          cp eden-fix/apply-v37-linux-cache-program-id.py eden-fix/v37-linux-cache-program-id.patch release/
          cp eden-fix/apply-v38-linux-save-quota.py eden-fix/v38-linux-save-quota.patch release/
          cp eden-fix/apply-v39-linux-profile-controller.py eden-fix/v39-linux-profile-controller.patch release/
          cp eden-fix/apply-v40-linux-additional-user.py eden-fix/v40-linux-additional-user.patch release/
          cp eden-fix/apply-v41-linux-shared-profile-state.py eden-fix/v41-linux-shared-profile-state.patch release/
          cp eden-fix/apply-v42-linux-shader-analysis-guard.py eden-fix/v42-linux-shader-analysis-guard.patch release/
          cp eden-fix/apply-v43-linux-invalid-shader-guard.py eden-fix/v43-linux-invalid-shader-guard.patch release/
          cp eden-fix/apply-v44-linux-shader-boundary.py eden-fix/v44-linux-shader-boundary.patch release/
          cp eden-fix/apply-v45-linux-unconditional-shader-exit.py eden-fix/v45-linux-unconditional-shader-exit.patch release/
          cp eden-fix/apply-v46-linux-rotating-shader-boundary.py eden-fix/v46-linux-rotating-shader-boundary.patch release/
          cp eden-fix/apply-v47-linux-stage4-shader-boundary.py eden-fix/v47-linux-stage4-shader-boundary.patch release/
          cp eden-fix/apply-v48-linux-stage4-rotating-prefix.py eden-fix/v48-linux-stage4-rotating-prefix.patch release/
          cp eden-fix/apply-v49-linux-split-screen-render-diag.py eden-fix/v49-linux-split-screen-render-diag.patch release/
          cp eden-fix/apply-v50-linux-stage0-rotating-prefix.py eden-fix/v50-linux-stage0-rotating-prefix.patch release/
          cp eden-fix/apply-v51-linux-split-screen-trace-rearm.py eden-fix/v51-linux-split-screen-trace-rearm.patch release/
          cp eden-fix/apply-v52-linux-delete-cache-storage.py eden-fix/v52-linux-delete-cache-storage.patch release/
          cp eden-fix/apply-v53-linux-half-screen-clear-compat.py eden-fix/v53-linux-half-screen-clear-compat.patch release/
          cp eden-fix/apply-v54-linux-clean-logs.py eden-fix/MINECRAFT-UPGRADE.md release/
          cp eden-fix/apply-v55-linux-save-session-stability.py eden-fix/v55-linux-save-session-stability.patch release/
          cp eden-fix/apply-v56-linux-docked-clear-compat.py eden-fix/v56-linux-docked-clear-compat.patch release/
          cp eden-fix/apply-v57-linux-docked-clear-rect.py eden-fix/v57-linux-docked-clear-rect.patch release/
          cp eden-fix/apply-v58-linux-docked-msaa-alias-diag.py eden-fix/v58-linux-docked-msaa-alias-diag.patch release/
          cp eden-fix/apply-v59-linux-docked-accelerated-present.py eden-fix/v59-linux-docked-accelerated-present.patch release/
          cp eden-fix/apply-v60-linux-durable-save-commit.py eden-fix/v60-linux-durable-save-commit.patch release/
          cp eden-fix/apply-v61-linux-death-respawn-guard.py eden-fix/v61-linux-death-respawn-guard.patch release/
          cp eden-fix/v33-linux-cache-reader.patch eden-fix/v34-linux-save-space-diag.patch release/
          cp eden-fix/v35-linux-save-data-uuid.patch release/
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Minecraft-Linux-death-respawn-guard-v61
          path: release/*

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eden-minecraft-linux-death-respawn-guard-v61-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eden Minecraft Linux death respawn guard v61 #${{ github.run_number }}
          prerelease: true
          body: |
            Linux test build based on Eden commit `${{ env.EDEN_COMMIT }}`.

            Preserves the complete v60 stack, including the working Docked 1920x1080
            presentation path, durable filesystem Commit(), controllers, and split-screen user state.

            The v60 session ended when Player 2 died and Minecraft hit a guest ARM NoExecute fault
            at address 0. The crash register state carried X28=0xDEADC0DE, a poison sentinel, which
            is consistent with a dead secondary-player HUD callback being dispatched during the
            death/respawn transition.

            V61 adds a deliberately narrow compatibility guard. It activates only for Minecraft
            title 0100D71004694000, only for a NoExecute fault at address 0/4, only when
            X28=0xDEADC0DE, and only when LR points to valid guest code. That exact callback is
            treated as a no-op by resuming at LR. Every other execute fault still follows Eden's
            normal fatal path.

            V61_FIX MinecraftDeadCallback markers identify any recovered death/respawn event.
            No renderer, save, controller, shader, or general CPU exception behavior is otherwise
            changed.
          files: release/*
