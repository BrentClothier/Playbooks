name: Validate Humboldt playbooks

on:
  pull_request:
    branches:
      - main
    paths:
      - "ansible/humboldt/**"
      - ".github/workflows/humboldt*-validate.yml"
  push:
    branches:
      - main
    paths:
      - "ansible/humboldt/**"
      - ".github/workflows/humboldt*-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install syntax-check dependencies
        run: python -m pip install "ansible-core==2.19.3" "PyYAML==6.0.2"

      - name: Parse Humboldt YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("ansible/humboldt").glob("*.y*ml"))
          paths += sorted(Path(".github/workflows").glob("humboldt*-validate.yml"))
          for path in paths:
              with path.open(encoding="utf-8") as source:
                  list(yaml.safe_load_all(source))
              print(f"Parsed {path}")
          PY

      # Syntax checking does not run tasks or connect to the managed hosts.
      - name: Check Humboldt Ansible syntax
        run: |
          for playbook in ansible/humboldt/*.yml; do
            ansible-playbook --syntax-check --inventory 'localhost,' "$playbook"
          done
