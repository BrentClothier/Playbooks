name: Build experimental Eden Minecraft render-pass probe v28

on:
  push:
    branches:
      - eden-minecraft-socket-fix
    paths:
      - ".github/workflows/build-eden-minecraft-fix-v28.yml"
      - "eden-fix/apply-v7.py"
      - "eden-fix/apply-v9.py"
      - "eden-fix/apply-v11.py"
      - "eden-fix/apply-v12.py"
      - "eden-fix/apply-v14b.py"
      - "eden-fix/apply-v15.py"
      - "eden-fix/apply-v16.py"
      - "eden-fix/apply-v17.py"
      - "eden-fix/apply-v18b.py"
      - "eden-fix/apply-v18c.py"
      - "eden-fix/apply-v19.py"
      - "eden-fix/apply-v20.py"
      - "eden-fix/apply-v21.py"
      - "eden-fix/apply-v22b.py"
      - "eden-fix/apply-v23b.py"
      - "eden-fix/apply-v24.py"
      - "eden-fix/apply-v25.py"
      - "eden-fix/apply-v26.py"
      - "eden-fix/apply-v27.py"
      - "eden-fix/apply-v28.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  EDEN_COMMIT: 54046ac60ef5d8876b550be2546b89d48751de7e
  BUILD_ID: test
  DEVEL: "true"
  FORCE_PGO: "false"
  TARGET: amd64
  COMPILER: gcc
  PGO_TARGET: standard
  FULL_ARCH: amd64-gcc-standard
  BUILD_TYPE: Release
  LTO: "OFF"
  CCACHE: "OFF"
  ARTIFACT_REF: minecraft-render-pass-probe-v28
  GITHUB_TAG: minecraft-render-pass-probe-v28
  B2_PUBLIC_URL: example.invalid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Git
        run: pacman -Sy --noconfirm git ca-certificates python

      - name: Check out Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ env.EDEN_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: eden-src

      - name: Check out Eden CI scripts
        uses: actions/checkout@v4
        with:
          repository: Eden-CI/Workflow
          ref: master
          path: eden-ci

      - name: Apply Minecraft compatibility, diagnostics, and render-pass probe
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eden-src/.ci
          cp -a eden-ci/.ci eden-src/.ci
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 28; do
            cp "eden-fix/apply-v${v}.py" "eden-src/apply-v${v}.py"
          done
          cd eden-src
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 28; do
            python "apply-v${v}.py"
          done
          git diff --check
          git diff --stat

      - name: Archive source
        run: tar --exclude=.git -C eden-src -cJf Eden-minecraft-render-pass-probe-v28-source.tar.xz .

      - name: Install dependencies
        working-directory: eden-src
        run: ./.ci/deps/arch.sh

      - name: Configure
        working-directory: eden-src
        run: ./.ci/build/configure.sh

      - name: Build
        working-directory: eden-src
        run: cmake --build build --parallel "$(nproc)"

      - name: Package AppImage
        working-directory: eden-src
        run: ./.ci/package/linux.sh

      - name: Prepare release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp eden-src/artifacts/*.AppImage release/Eden-Linux-minecraft-render-pass-probe-v28-amd64-gcc-standard.AppImage
          cp Eden-minecraft-render-pass-probe-v28-source.tar.xz release/
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 28; do
            cp "eden-fix/apply-v${v}.py" release/
          done
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Minecraft-render-pass-probe-Linux-v28
          path: release/*

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eden-minecraft-render-pass-probe-v28-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eden experimental Minecraft render-pass probe v28 #${{ github.run_number }}
          prerelease: true
          body: |
            Experimental Linux build based on Eden commit `${{ env.EDEN_COMMIT }}`.

            V27 correctly rebuilt the persistent shader cache and gave Minecraft's window-space scanout pipeline a distinct viewport-mode key. The scanout draw still targeted the exact rotating 1280x720 images, and all 24 sampled Vulkan staging downloads remained entirely zero. The cache-key collision was therefore not the remaining blank-screen cause.

            V28 is a binary render-pass probe. Immediately after Minecraft's characteristic non-indexed 4-vertex scanout draw, Eden clears that same 1280x720 color attachment to magenta. A magenta screen or nonzero staging sample proves the attachment, command submission, synchronization, readback, and presentation path all work; the failure is then inside the guest draw itself. If it remains black and zero, the failure is below the guest shaders in render-pass/attachment execution.

            V28 also logs `V28_DIAG ScanoutPipeline`, `V28_DIAG BoundImage`, and `V28_PROBE ForcedScanoutClear` so the source image descriptors and final raster state are captured in the same run.

            This build deliberately replaces Minecraft's final image with magenta for diagnosis. Back up saves before testing.
          files: release/*
