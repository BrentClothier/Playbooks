name: Build experimental Eden Minecraft framebuffer fix v26

on:
  push:
    branches:
      - eden-minecraft-socket-fix
    paths:
      - ".github/workflows/build-eden-minecraft-fix-v26.yml"
      - "eden-fix/apply-v7.py"
      - "eden-fix/apply-v9.py"
      - "eden-fix/apply-v11.py"
      - "eden-fix/apply-v12.py"
      - "eden-fix/apply-v14b.py"
      - "eden-fix/apply-v15.py"
      - "eden-fix/apply-v16.py"
      - "eden-fix/apply-v17.py"
      - "eden-fix/apply-v18b.py"
      - "eden-fix/apply-v18c.py"
      - "eden-fix/apply-v19.py"
      - "eden-fix/apply-v20.py"
      - "eden-fix/apply-v21.py"
      - "eden-fix/apply-v22b.py"
      - "eden-fix/apply-v23b.py"
      - "eden-fix/apply-v24.py"
      - "eden-fix/apply-v25.py"
      - "eden-fix/apply-v26.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  EDEN_COMMIT: 54046ac60ef5d8876b550be2546b89d48751de7e
  BUILD_ID: test
  DEVEL: "true"
  FORCE_PGO: "false"
  TARGET: amd64
  COMPILER: gcc
  PGO_TARGET: standard
  FULL_ARCH: amd64-gcc-standard
  BUILD_TYPE: Release
  LTO: "OFF"
  CCACHE: "OFF"
  ARTIFACT_REF: minecraft-framebuffer-fix-v26
  GITHUB_TAG: minecraft-framebuffer-fix-v26
  B2_PUBLIC_URL: example.invalid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Git
        run: pacman -Sy --noconfirm git ca-certificates python

      - name: Check out Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ env.EDEN_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: eden-src

      - name: Check out Eden CI scripts
        uses: actions/checkout@v4
        with:
          repository: Eden-CI/Workflow
          ref: master
          path: eden-ci

      - name: Apply Minecraft compatibility, diagnostics, and framebuffer fix
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eden-src/.ci
          cp -a eden-ci/.ci eden-src/.ci
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26; do
            cp "eden-fix/apply-v${v}.py" "eden-src/apply-v${v}.py"
          done
          cd eden-src
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26; do
            python "apply-v${v}.py"
          done
          git diff --check
          git diff --stat

      - name: Archive source
        run: tar --exclude=.git -C eden-src -cJf Eden-minecraft-framebuffer-fix-v26-source.tar.xz .

      - name: Install dependencies
        working-directory: eden-src
        run: ./.ci/deps/arch.sh

      - name: Configure
        working-directory: eden-src
        run: ./.ci/build/configure.sh

      - name: Build
        working-directory: eden-src
        run: cmake --build build --parallel "$(nproc)"

      - name: Package AppImage
        working-directory: eden-src
        run: ./.ci/package/linux.sh

      - name: Prepare release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp eden-src/artifacts/*.AppImage release/Eden-Linux-minecraft-framebuffer-fix-v26-amd64-gcc-standard.AppImage
          cp Eden-minecraft-framebuffer-fix-v26-source.tar.xz release/
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26; do
            cp "eden-fix/apply-v${v}.py" release/
          done
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Minecraft-framebuffer-fix-Linux-v26
          path: release/*

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eden-minecraft-framebuffer-fix-v26-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eden experimental Minecraft framebuffer fix v26 #${{ github.run_number }}
          prerelease: true
          body: |
            Experimental Linux build based on Eden commit `${{ env.EDEN_COMMIT }}`.

            V25 proved that Minecraft's final fullscreen draws target the exact Nvnflinger scanout images with rasterization enabled, all RGBA channels writable, and no depth or stencil rejection. It also exposed the concrete failure: those scanout attachments are 1280x720, while Eden creates their Vulkan framebuffer/render area from a 16384x16384 guest surface clip.

            A non-imageless Vulkan framebuffer must not be wider or taller than any attachment used by its render pass. V26 clamps Eden's framebuffer/render area to the smallest active attachment's actual host extent, while preserving the guest viewport and scissor state. The normal offscreen 1280x720 passes are unchanged; only invalid oversized framebuffer extents are reduced.

            Look for `V26_FIX ClampFramebufferExtent` in the log. For Minecraft handheld scanout it should report `requested=16384x16384 attachment_limit=1280x720`.

            Back up saves before testing.
          files: release/*
