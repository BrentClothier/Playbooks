name: Build experimental Eden Minecraft MSAA alias fix v29

on:
  push:
    branches:
      - eden-minecraft-socket-fix
    paths:
      - ".github/workflows/build-eden-minecraft-fix-v29.yml"
      - "eden-fix/apply-v7.py"
      - "eden-fix/apply-v9.py"
      - "eden-fix/apply-v11.py"
      - "eden-fix/apply-v12.py"
      - "eden-fix/apply-v14b.py"
      - "eden-fix/apply-v15.py"
      - "eden-fix/apply-v16.py"
      - "eden-fix/apply-v17.py"
      - "eden-fix/apply-v18b.py"
      - "eden-fix/apply-v18c.py"
      - "eden-fix/apply-v19.py"
      - "eden-fix/apply-v20.py"
      - "eden-fix/apply-v21.py"
      - "eden-fix/apply-v22b.py"
      - "eden-fix/apply-v23b.py"
      - "eden-fix/apply-v24.py"
      - "eden-fix/apply-v25.py"
      - "eden-fix/apply-v26.py"
      - "eden-fix/apply-v27.py"
      - "eden-fix/apply-v29.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  EDEN_COMMIT: 54046ac60ef5d8876b550be2546b89d48751de7e
  BUILD_ID: test
  DEVEL: "true"
  FORCE_PGO: "false"
  TARGET: amd64
  COMPILER: gcc
  PGO_TARGET: standard
  FULL_ARCH: amd64-gcc-standard
  BUILD_TYPE: Release
  LTO: "OFF"
  CCACHE: "OFF"
  ARTIFACT_REF: minecraft-msaa-alias-fix-v29
  GITHUB_TAG: minecraft-msaa-alias-fix-v29
  B2_PUBLIC_URL: example.invalid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Git
        run: pacman -Sy --noconfirm git ca-certificates python

      - name: Check out Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ env.EDEN_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: eden-src

      - name: Check out Eden CI scripts
        uses: actions/checkout@v4
        with:
          repository: Eden-CI/Workflow
          ref: master
          path: eden-ci

      - name: Apply Minecraft compatibility, diagnostics, and MSAA alias fix
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eden-src/.ci
          cp -a eden-ci/.ci eden-src/.ci
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29; do
            cp "eden-fix/apply-v${v}.py" "eden-src/apply-v${v}.py"
          done
          cd eden-src
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29; do
            python "apply-v${v}.py"
          done
          git diff --check
          git diff --stat

      - name: Archive source
        run: tar --exclude=.git -C eden-src -cJf Eden-minecraft-msaa-alias-fix-v29-source.tar.xz .

      - name: Install dependencies
        working-directory: eden-src
        run: ./.ci/deps/arch.sh

      - name: Configure
        working-directory: eden-src
        run: ./.ci/build/configure.sh

      - name: Build
        working-directory: eden-src
        run: cmake --build build --parallel "$(nproc)"

      - name: Package AppImage
        working-directory: eden-src
        run: ./.ci/package/linux.sh

      - name: Prepare release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp eden-src/artifacts/*.AppImage release/Eden-Linux-minecraft-msaa-alias-fix-v29-amd64-gcc-standard.AppImage
          cp Eden-minecraft-msaa-alias-fix-v29-source.tar.xz release/
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29; do
            cp "eden-fix/apply-v${v}.py" release/
          done
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Minecraft-msaa-alias-fix-Linux-v29
          path: release/*

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eden-minecraft-msaa-alias-fix-v29-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eden experimental Minecraft MSAA alias fix v29 #${{ github.run_number }}
          prerelease: true
          body: |
            Experimental Linux build based on Eden commit `${{ env.EDEN_COMMIT }}`.

            V28's forced magenta clear appeared on screen and changed every sampled scanout image from all-zero data to nonzero data. That proved Eden's framebuffer attachment, Vulkan render pass, command execution, synchronization, GPU readback, guest-memory writeback, raw upload, Nvnflinger composition, and host presentation path are working.

            The V28 descriptor trace exposed the remaining handoff: Minecraft renders into a 2x-MSAA image at GPU address `0x4131c0000`, then its final fullscreen pass samples a separate single-sample image at that same address. Eden records the two host images as aliases, but `SynchronizeAliases` always used the ordinary image-copy path even when their sample counts differed. That path cannot correctly transfer a 2x-MSAA image into a 1x sampled image.

            V29 makes alias synchronization sample-aware. When alias sample counts differ, it uses Eden's existing `CopyImageMSAA` conversion path; matching-sample aliases continue to use the normal copy path. Look for `V29_FIX SyncAliasSamples` in the log.

            The V28 magenta probe is deliberately not included in this build, so the screen will show Minecraft's actual output if the resolve fixes the handoff.

            Back up saves before testing.
          files: release/*
