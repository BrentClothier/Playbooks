name: Build Eden Minecraft Linux storage fix v31

on:
  push:
    branches:
      - eden-minecraft-socket-fix
    paths:
      - ".github/workflows/build-eden-minecraft-fix-v31-linux.yml"
      - "eden-fix/apply-v7.py"
      - "eden-fix/apply-v9.py"
      - "eden-fix/apply-v11.py"
      - "eden-fix/apply-v12.py"
      - "eden-fix/apply-v14b.py"
      - "eden-fix/apply-v15.py"
      - "eden-fix/apply-v16.py"
      - "eden-fix/apply-v17.py"
      - "eden-fix/apply-v18b.py"
      - "eden-fix/apply-v18c.py"
      - "eden-fix/apply-v19.py"
      - "eden-fix/apply-v20.py"
      - "eden-fix/apply-v21.py"
      - "eden-fix/apply-v22b.py"
      - "eden-fix/apply-v23b.py"
      - "eden-fix/apply-v24.py"
      - "eden-fix/apply-v25.py"
      - "eden-fix/apply-v26.py"
      - "eden-fix/apply-v27.py"
      - "eden-fix/apply-v29.py"
      - "eden-fix/apply-v30.py"
      - "eden-fix/apply-v31-linux-storage.py"
      - "eden-fix/v31-linux-storage.patch"
  workflow_dispatch:

permissions:
  contents: write

env:
  EDEN_COMMIT: 54046ac60ef5d8876b550be2546b89d48751de7e
  BUILD_ID: test
  DEVEL: "true"
  FORCE_PGO: "false"
  TARGET: amd64
  COMPILER: gcc
  PGO_TARGET: standard
  FULL_ARCH: amd64-gcc-standard
  BUILD_TYPE: Release
  LTO: "OFF"
  CCACHE: "OFF"
  ARTIFACT_REF: minecraft-linux-storage-fix-v31
  GITHUB_TAG: minecraft-linux-storage-fix-v31
  B2_PUBLIC_URL: example.invalid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Git
        run: pacman -Sy --noconfirm git ca-certificates python

      - name: Check out Eden source
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ env.EDEN_COMMIT }}
          submodules: recursive
          fetch-depth: 0
          path: eden-src

      - name: Check out Eden CI scripts
        uses: actions/checkout@v4
        with:
          repository: Eden-CI/Workflow
          ref: master
          path: eden-ci

      - name: Apply v30 graphics fixes and v31 temporary-storage root fix
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eden-src/.ci
          cp -a eden-ci/.ci eden-src/.ci
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            cp "eden-fix/apply-v${v}.py" "eden-src/apply-v${v}.py"
          done
          cp eden-fix/apply-v31-linux-storage.py eden-src/
          cd eden-src
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            python "apply-v${v}.py"
          done
          python apply-v31-linux-storage.py
          git diff --check
          git diff --stat

      - name: Archive source
        run: tar --exclude=.git -C eden-src -cJf Eden-minecraft-linux-storage-fix-v31-source.tar.xz .

      - name: Install dependencies
        working-directory: eden-src
        run: ./.ci/deps/arch.sh

      - name: Configure
        working-directory: eden-src
        run: ./.ci/build/configure.sh

      - name: Build
        working-directory: eden-src
        run: cmake --build build --parallel "$(nproc)"

      - name: Package AppImage
        working-directory: eden-src
        run: ./.ci/package/linux.sh

      - name: Prepare release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp eden-src/artifacts/*.AppImage release/Eden-Linux-minecraft-storage-fix-v31-amd64-gcc-standard.AppImage
          cp Eden-minecraft-linux-storage-fix-v31-source.tar.xz release/
          for v in 7 9 11 12 14b 15 16 17 18b 18c 19 20 21 22b 23b 24 25 26 27 29 30; do
            cp "eden-fix/apply-v${v}.py" release/
          done
          cp eden-fix/apply-v31-linux-storage.py eden-fix/v31-linux-storage.patch release/
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Minecraft-Linux-storage-fix-v31
          path: release/*

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eden-minecraft-linux-storage-fix-v31-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eden Minecraft Linux storage fix v31 #${{ github.run_number }}
          prerelease: true
          body: |
            Experimental Linux build based on Eden commit `${{ env.EDEN_COMMIT }}` and the exact
            working v30 Linux patch stack.

            The baseline already contains the upstream mappings from `SaveDataSpaceId::Temporary`
            to `NandUser` and from `ProperSystem`/`SafeMode` to `NandSystem` in both FSP_SRV save
            open paths. V31 verifies those mappings at build time and does not rewrite them.

            V31 fixes the remaining `space_id=03` enumeration failure by recreating the empty
            temporary save-data root immediately after startup cleanup. This keeps the expected
            temporary-storage reset while allowing `OpenSaveDataInfoReaderOnlyCacheStorage` to
            enumerate an empty, valid root. `CreateCacheStorage` and `GetCacheStorageSize` remain
            unchanged for this narrow test.

            The v29 sample-aware alias synchronization and v30 relaxed sample alias registration
            are applied unchanged. Look for `V31_FIX RecreatedTemporarySaveRoot`, followed by no
            `FindAllSaves` invalid-root error for `space_id=03`. The v29/v30 graphics diagnostics
            remain available as before.

            Back up saves before testing.
          files: release/*
