name: Validate HomeLab MCP diagnostics

on:
  pull_request:
    paths:
      - "stacks/homelab-mcp/**"
      - ".github/workflows/homelab-mcp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile stacks/homelab-mcp/server.py
      - name: Test read-only migration diagnostics
        run: python -m unittest discover -s stacks/homelab-mcp/tests -v
